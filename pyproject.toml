[project]
name = "tsa-conformal"
version = "0.1.0"
description = "Conformal calibration of a transient stability assessment model under topology shift"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsa_conformal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
